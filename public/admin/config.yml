backend:
  name: git-gateway
  branch: main
  site_domain: eloquent-concha-0db33c.netlify.app

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: posts
    label: Новости
    folder: content/posts
    create: true
    fields:
      - label: Заголовок
        name: title
        widget: string

      - label: Дата
        name: date
        widget: datetime

      - label: Изображение
        name: image
        widget: image

      - label: Краткое описание
        name: excerpt
        widget: text

      - label: Текст
        name: body
        widget: markdown